  unknown-preset: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Unknown preset</sc></gray> <white><preset></white><gray>.</gray>'
  specify-region: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Please specify a region id.</sc></gray>'
  not-in-region: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>You are not standing in a region.</sc></gray>'
  invalid-id: '<prefix><#ff5c5c>✖</#ff5c5c> <white><id></white> <gray><sc>is not a valid id (letters, numbers, - _ , '' + /).</sc></gray>'
  exists: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>A region named</sc></gray> <white><id></white> <gray><sc>already exists.</sc></gray>'
  not-a-number: '<prefix><#ff5c5c>✖</#ff5c5c> <white><value></white> <gray><sc>is not a number.</sc></gray>'
  global-not-allowed: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>That does not work on the global region.</sc></gray>'
  circular: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Circular inheritance:</sc></gray> <white><parent></white> <gray><sc>already inherits from</sc></gray> <white><region></white><gray>.</gray>'
  flag-format: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Invalid value for</sc></gray> <white><flag></white><gray>: <reason></gray>'
  flag-disabled: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>The flag</sc></gray> <white><flag></white> <gray><sc>is disabled on this server.</sc></gray>'
  flag-no-permission: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>You may not change</sc></gray> <white><flag></white><gray>.</gray>'
  cancelled: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Another plugin cancelled that change.</sc></gray>'
  internal: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Something went wrong:</sc></gray> <white><error></white>'

