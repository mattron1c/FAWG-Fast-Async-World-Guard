  claim: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg claim <id></white>'
  redefine: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg redefine <id></white>'
  remove: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg remove <id> [-f]</white>'
  rename: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg rename <id> <new-id></white>'
  priority: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg setpriority <id> <priority></white>'
  parent: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg setparent <id> [parent]</white>'
  addowner: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg addowner <id> <player|g:group…></white>'
  addmember: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg addmember <id> <player|g:group…></white>'
  removeowner: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg removeowner <id> <player…> [-a]</white>'
  removemember: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg removemember <id> <player…> [-a]</white>'
  flag: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg flag <id> <flag> [-g group] [value]</white> <dark_gray>— <sc>leave the value out to unset</sc></dark_gray>'
  copyflags: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg copyflags <from> <to> [-r]</white>'
  preset: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg preset <id> <preset></white> <dark_gray>(<presets>)</dark_gray>'
  search: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg search <text> [page]</white>'
  seltype: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg seltype <cuboid|poly|cylinder|sphere></white>'
  expand: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg expand <amount|vert> [direction]</white>'
  exclude: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg exclude <id> <add|remove|list|clear></white> <dark_gray>— <sc>uses your selection</sc></dark_gray>'
  lock: '<prefix><gray><sc>Usage:</sc></gray> <white>/rg lock <id> [server|player|break-allowed|break-only]</white>'
  import: '<prefix><gray><sc>Usage:</sc></gray> <white>/fawg import worldguard [world] [--replace]</white>'
  backup: '<prefix><gray><sc>Usage:</sc></gray> <white>/fawg backup <create|list|restore> [name]</white>'
  test: '<prefix><gray><sc>Usage:</sc></gray> <white>/fawg test <flag> [player]</white>'

