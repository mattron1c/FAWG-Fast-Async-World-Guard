# ─────────────────────────────────────────────────────────────────────────────────────────────
#  FastAsyncWorldGuard · messages.yml
#  MiniMessage format (https://docs.advntr.dev/minimessage/format.html)
#  Extra tags:  <prefix>  <divider>  <divider-short>  <star>  <sc>small caps</sc>
#  Placeholders: <name> inserts a value as plain text, %name% also works inside click / hover arguments.
#  Bedrock players get the <sc> text without small caps when style.bedrock-small-caps is false.
# ─────────────────────────────────────────────────────────────────────────────────────────────

protection:
  denied: '<#ff5c5c><b>⛔</b></#ff5c5c> <#ffb3b3><b><sc>Hey!</sc></b></#ffb3b3> <gray><sc>You can''t</sc></gray> <white><action></white> <gray><sc>here.</sc></gray>'
  command-blocked: '<prefix><#ff5c5c>⛔</#ff5c5c> <gray><sc>The command</sc></gray> <white><command></white> <gray><sc>is blocked in this region.</sc></gray>'
  chat-blocked: '<prefix><#ff5c5c>🔇</#ff5c5c> <gray><sc>Chat is disabled in this region.</sc></gray>'
  chat-cooldown: '<prefix><#ffcf5c>⏳</#ffcf5c> <gray><sc>Slow down! Wait</sc></gray> <white><seconds>s</white><gray>.</gray>'

movement:
  entry-denied: '<prefix><#ff5c5c><b>🚫</b></#ff5c5c> <gray><sc>You may not enter</sc></gray> <white><region></white><gray>.</gray>'
  exit-denied: '<prefix><#ff5c5c><b>🚫</b></#ff5c5c> <gray><sc>You may not leave</sc></gray> <white><region></white><gray>.</gray>'
  entry-permission: '<prefix><#ff5c5c>🔒</#ff5c5c> <gray><sc>You don''t have access to</sc></gray> <white><region></white><gray>.</gray>'
  entry-level-low: '<prefix><#ffcf5c>⭐</#ffcf5c> <gray><sc>Your level is too low to enter</sc></gray> <white><region></white><gray>.</gray>'
  entry-level-high: '<prefix><#ffcf5c>⭐</#ffcf5c> <gray><sc>Your level is too high to enter</sc></gray> <white><region></white><gray>.</gray>'
  entry-full: '<prefix><#ffcf5c>👥</#ffcf5c> <white><region></white> <gray><sc>is full right now.</sc></gray>'
  entry-cooldown: '<prefix><#ffcf5c>⏳</#ffcf5c> <gray><sc>You must wait before entering</sc></gray> <white><region></white> <gray><sc>again.</sc></gray>'

notify:
  enter: '<prefix><#ffb3b3>➜</#ffb3b3> <white><player></white> <gray><sc>entered</sc></gray> <#ff5c5c><region></#ff5c5c>'
  leave: '<prefix><#ffb3b3>⬅</#ffb3b3> <white><player></white> <gray><sc>left</sc></gray> <#ff5c5c><region></#ff5c5c>'

spy:
  denied: '<prefix><#ff5c5c>👁</#ff5c5c> <white><player></white> <gray><sc>tried to</sc></gray> <white><action></white> <gray>(<flag>)</gray> <gray><sc>in</sc></gray> <#ff5c5c><region></#ff5c5c> <dark_gray><x> <y> <z> <world></dark_gray>'
  worldedit: '<prefix><#ff5c5c>🪓</#ff5c5c> <white><player></white> <gray><sc>tried</sc></gray> <white><command></white> <gray><sc>on</sc></gray> <#ff5c5c><region></#ff5c5c> <dark_gray><x> <y> <z> <world></dark_gray>'

worldedit:
  denied: '<prefix><#ff5c5c><b>🪓</b></#ff5c5c> <gray><sc>You can''t use</sc></gray> <white><command></white> <gray><sc>on protected region</sc></gray> <#ff5c5c><region></#ff5c5c><gray>.</gray>'

error:
