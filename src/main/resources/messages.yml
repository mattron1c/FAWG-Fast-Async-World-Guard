  unknown-world: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Unknown world</sc></gray> <white><world></white><gray>.</gray>'
  unknown-player: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Unknown player</sc></gray> <white><player></white><gray>.</gray>'
  unknown-flag: '<prefix><#ff5c5c>✖</#ff5c5c> <gray><sc>Unknown flag</sc></gray> <white><flag></white><gray>. <sc>Did you mean</sc></gray> <#ffb3b3><suggestions></#ffb3b3><gray>?</gray>'
