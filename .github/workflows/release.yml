name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without v)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build
        run: ./gradlew build -Pversion=${{ steps.v.outputs.version }}
      - name: Extract changelog
        run: |
          awk -v v="## [${{ steps.v.outputs.version }}]" 'index($0, v)==1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md" > RELEASE_NOTES.md
      - name: Checksums
        run: |
          cd build/libs && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt
          printf '\n\n### ✦ Install\nDrop the jar into `plugins/` (Paper 1.21.8 – 26.3, Java 21+, Java 25 on 26.x) and restart.\nComing from WorldGuard? `/fawg import worldguard` → `/fawg cleanup confirm`.\n' >> "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FastAsyncWorldGuard ${{ steps.v.outputs.version }}
          tag_name: v${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          generate_release_notes: true
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: build/libs/*.jar
          name: FastAsyncWorldGuard ${{ steps.v.outputs.version }}
          version: ${{ steps.v.outputs.version }}
          version-type: release
          changelog-file: RELEASE_NOTES.md
          loaders: |
            paper
            purpur
          game-versions: |
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1.1
            26.1.2
            26.2
            26.3
          java: |
            21
            25
          dependencies: |
            worldedit(optional)
            fastasyncworldedit(optional)
            placeholderapi(optional)
            geyser(optional)
            floodgate(optional)
