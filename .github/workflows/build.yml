name: Build & Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Paper 1.21.8 API, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + unit tests
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FastAsyncWorldGuard
          path: build/libs/*.jar
          if-no-files-found: error

  compat:
    name: Compile against ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Paper 1.21.11
            line: '1\.21\.11-R0\.1-SNAPSHOT'
            java: '21'
          - label: Paper 26.x (latest)
            line: '26\.[0-9.]+\.build\.[0-9]+-stable'
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve Paper API version
        id: ver
        run: |
          V=$(curl -fsSL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -E '^${{ matrix.line }}$' | sort -V | tail -1)
          echo "Using paper-api $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Compile
        run: ./gradlew compileJava -PpaperVersion=${{ steps.ver.outputs.v }} -PjavaRelease=${{ matrix.java }} --stacktrace

  smoke:
    name: Live server · ${{ matrix.mc }} · ${{ matrix.mode }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.8',  java: '21', mode: worldguard }
          - { mc: '1.21.11', java: '21', mode: fawe }
          - { mc: '26.1.2',  java: '25', mode: basic }
          - { mc: '26.3',    java: '25', mode: basic }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: FastAsyncWorldGuard
          path: dist
      - name: Run server
        run: scripts/smoke-test.sh "${{ matrix.mc }}" "$(ls dist/*.jar | head -1)" "${{ matrix.mode }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log-${{ matrix.mc }}-${{ matrix.mode }}
          path: run/*/server.log
